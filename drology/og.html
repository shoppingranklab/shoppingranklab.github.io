<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>og</title>
<style>
@font-face{font-family:"Pretendard";src:url("assets/pretendard.woff2") format("woff2-variations");font-weight:45 920;font-display:block;}
@font-face{font-family:"NanumMyeongjo";src:url("assets/nanum-myeongjo.woff2") format("woff2");font-weight:400;font-display:block;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:1200px;height:630px;overflow:hidden;}
body{
  font-family:"Pretendard",sans-serif;color:#121A17;
  background:
    radial-gradient(760px 420px at 6% -10%, rgba(111,185,223,.20), transparent 62%),
    radial-gradient(680px 420px at 96% 0%, rgba(176,138,82,.18), transparent 60%),
    linear-gradient(160deg,#FCFAF6 0%,#F7F4ED 52%,#F2EDE2 100%);
  padding:62px 64px 54px;display:flex;flex-direction:column;justify-content:space-between;
  position:relative;
}
.og-head img{width:196px;height:auto;display:block;}
.og-body{display:flex;align-items:flex-end;justify-content:space-between;gap:56px;margin-top:8px;}
.og-copy{max-width:660px;}
.og-eyebrow{font-size:14px;font-weight:600;letter-spacing:.16em;color:#7E8A85;text-transform:uppercase;margin-bottom:20px;}
h1{font-family:"NanumMyeongjo",serif;font-weight:400;font-size:52px;line-height:1.32;letter-spacing:-.03em;color:#121A17;}
h1 em{font-style:normal;position:relative;}
h1 em::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:2px;background:linear-gradient(90deg,#B08A52,rgba(176,138,82,.15));}
.og-sub{margin-top:22px;font-size:18px;line-height:1.7;color:#414C48;letter-spacing:-.01em;}
.og-products{display:flex;gap:14px;flex-shrink:0;}
.og-products figure{width:118px;height:118px;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 10px 26px -14px rgba(18,26,23,.35);}
.og-products img{width:100%;height:100%;object-fit:cover;display:block;}
.og-foot{display:flex;align-items:center;justify-content:space-between;font-size:14px;letter-spacing:.02em;color:#7E8A85;border-top:1px solid #E2DDD2;padding-top:20px;}
.og-foot b{font-family:"NanumMyeongjo",serif;font-weight:400;font-size:20px;color:#121A17;letter-spacing:.02em;}
</style>
</head>
<body>
  <div class="og-head"><img src="assets/logo.jpg" alt="닥터올로지 Dr.Ology"></div>
  <div class="og-body">
    <div class="og-copy">
      <p class="og-eyebrow">가정의학과 전문의가 직접 운영하는 브랜드</p>
      <h1>진료실의 꼼꼼함을,<br>매일의 <em>루틴</em>으로.</h1>
      <p class="og-sub">원료의 산지와 함량, 배합과 제형을 하나씩 확인해<br>매일 부담 없이 챙길 수 있는 제품으로 담았습니다.</p>
    </div>
    <div class="og-products">
      <figure><img src="assets/collagen.jpg" alt=""></figure>
      <figure><img src="assets/melatonin.jpg" alt=""></figure>
      <figure><img src="assets/folate.jpg" alt=""></figure>
      <figure><img src="assets/glutathione.jpg" alt=""></figure>
    </div>
  </div>
  <div class="og-foot">
    <b>Dr.Ology</b>
    <span>가정의학과 전문의가 직접 운영하는 브랜드</span>
    <span>070-8080-5470</span>
    <span>cestlavie4705.cafe24.com</span>
  </div>
</body>
</html>
